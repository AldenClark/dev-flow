foundational_collections_and_system_choices:
  note: "Ordinary maps prefer hashbrown; time and date default to Jiff with Chrono retired."
  collections_memory_concurrency:
    status: active
    categories:
      M1_sequence_and_sets:
        status: active
        defaults:
          sequence: Vec
          queue_or_deque: VecDeque
          priority_queue: BinaryHeap
          membership: HashSet
          sorted_set: BTreeSet
        conditional:
          SmallVec: measured_small_collection_hotspot
          ArrayVec: explicit_fixed_capacity_with_overflow_handling
          heapless: no_std_hard_realtime_or_no_allocator
        rules: [bound_growth, distrust_external_capacity_hints, shrink_at_lifecycle_boundaries]
      M2_maps_and_hashers:
        status: active
        defaults:
          ordinary_unordered_keys: hashbrown_HashMap_with_default_foldhash
          explicit_hashdos_threat: std_HashMap_with_RandomState_or_hashbrown_with_secure_hasher
          sorted_range_or_deterministic_iteration: BTreeMap
          insertion_order_is_domain_semantics: IndexMap
        conditional:
          scc_HashMap: measured_high_concurrency
          DashMap: ergonomic_or_migration_alternative
          alternate_hasher_beyond_hashbrown_default: trusted_input_and_benchmark_only
        concurrency_ladder: [owner_task, parking_lot_Mutex_hashbrown_HashMap, measured_RwLock, scc_HashMap]
        rules: [entry_to_avoid_double_lookup, key_Eq_Hash_must_not_mutate, no_guard_across_await, secure_hasher_choice_must_be_explicit_at_security_boundary]
      M3_handles_arenas_and_allocators:
        status: active
        defaults: [Vec_plus_index_for_non_deleting_local_handles, system_allocator]
        conditional:
          slab: short_lived_internal_reusable_keys
          slotmap: escaping_handles_and_stale_key_or_ABA_protection
          DenseSlotMap: iteration_heavy_stable_handles
          bumpalo: phase_local_bulk_lifetime_without_implicit_Drop
          custom_global_allocator: production_profile_per_binary_and_target
        rules: [RAII_resources_outside_raw_arena, allocation_and_free_in_same_FFI_module]
      M4_shared_state_and_sync:
        status: active
        preference_order: [ownership_and_mut_borrow, Arc_immutable, short_sync_Mutex, owner_task]
        conditional:
          RwLock: measured_read_dominant
          tokio_lock: guard_must_cross_await
          atomics: scalar_flag_counter_or_proven_state_machine
          ArcSwap: read_mostly_immutable_snapshot
          OnceLock_or_LazyLock: synchronous_once_initialization
          tokio_OnceCell: asynchronous_once_initialization
        rules: [document_atomic_ordering, define_lock_order, no_guard_across_await_callback_or_FFI, avoid_service_locator]
      M5_channels_events_and_streams:
        status: active
        tokio:
          work_queue: bounded_mpsc
          one_reply: oneshot
          latest_state: watch
          lag_tolerant_multicast: broadcast
          resource_limit: Semaphore
          wake_only: Notify
        sync_threads: bounded_crossbeam_channel_for_MPMC_or_select
        rules: [unbounded_requires_proven_bound_or_spooling, observe_depth_wait_drop, define_close_cancel_drain_retry, never_collect_unknown_stream_without_limits]
      M6_bytes_strings_and_io:
