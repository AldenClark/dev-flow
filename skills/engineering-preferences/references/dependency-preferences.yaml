policy_version: "0.2.0"
maintained_on: "2026-08-09"

project_archetypes:
  primary:
    - rust_service
    - daemon_or_agent
    - library_sdk_or_ffi
    - rust_native_desktop
    - react_control_console
    - astro_documentation_site
  added:
    - cli_or_tui
    - background_worker_or_scheduler
  not_default:
    - ssr_public_website
    - pwa_or_offline_web
  repository_rule: same_product_rust_and_web_share_one_git_root_unless_lifecycle_or_security_boundary_requires_split

rust:
  toolchain:
    edition: "2024"
    product_toolchain: "1.97.1"
    upgrade_policy: evaluate_each_stable_release_approximately_every_6_weeks
    public_library_policy: test_msrv_and_latest_stable
    workspace_resolver: "3"
    components: [rustfmt, clippy]
  strong_defaults:
    - name: tokio
      version_baseline: "1.52-1.53"
      purpose: async runtime
    - name: serde
      version_baseline: "1"
      features: [derive]
      purpose: serialization
    - name: serde_json
      version_baseline: "1"
      purpose: JSON APIs events and configuration
    - name: thiserror
      version_baseline: "2"
      purpose: typed library and domain errors
    - name: reqwest
      version_baseline: "0.13"
      default_features: false
      preferred_features: [json, rustls, stream]
      purpose: HTTP client
    - name: parking_lot
      version_baseline: "0.12"
      purpose: synchronous locks
    - name: postcard
      version_baseline: "1.1"
      purpose: compact binary protocols
  service_defaults:
    - { name: axum, version_baseline: "0.8" }
    - { name: tower, version_baseline: "0.5" }
    - { name: clap, version_baseline: "4", features: [derive, env] }
    - { name: tracing, version_baseline: "0.1" }
    - { name: tracing-subscriber, version_baseline: "0.3", features: [env-filter, json] }
    - { name: arc-swap, version_baseline: "1.9" }
  conditional:
    native_desktop_ui:
      preferred: [gpui, gpui-component]
    tls:
      preferred: rustls
      version_baseline: "0.23"
    quic:
      preferred: quinn
      version_baseline: "0.11"
    sqlite:
      preferred: rusqlite
      version_baseline: "0.37-0.40"
    multi_database_async:
      preferred: sqlx
      version_baseline: "0.8"
    postgres_direct:
      preferred: tokio-postgres
      version_baseline: "0.7"
    websocket_client:
      preferred: tokio-tungstenite
    concurrent_map:
      candidates: [dashmap, scc]
      rule: benchmark_before_adoption
    secrets:
      candidates: [zeroize, secrecy, subtle]
      rule: threat_model_driven
    test_temp_resources:
      preferred: tempfile
      version_baseline: "3"
    platform_ffi:
      android: [jni]
      apple: [objc2, core-foundation, security-framework]
      windows: [windows, windows-sys]
  governance:
    - centralize workspace dependencies and lints
    - commit Cargo.lock and use --locked in CI
    - explicitly select TLS provider roots and features
    - use panic abort only without unwind-sensitive FFI boundaries
    - keep platform FFI and UI dependencies out of domain crates
  foundation:
    crate_layers:
      order: [domain, application, adapters, platform_or_apps]
      domain_forbidden_dependencies: [async_runtime, web_framework, database_driver, ffi, ui_framework]
      cargo_features: additive_and_minimal_by_default
    async_runtime:
      default: tokio
      long_lived_tasks: [cancellation-token, task-tracker]
      channels: bounded_by_default
      lock_rule: do_not_hold_sync_lock_across_await
      concurrent_map_rule: benchmark_before_adoption
      async_trait_rule: native_for_static_dispatch_async_trait_only_for_dyn_dispatch
    errors:
      library_and_domain: thiserror
      application_boundary: anyhow
      cli_and_tui_diagnostics: miette
      external_contract: stable_error_codes_without_internal_source_chain
      ffi_panic: catch_and_translate
    configuration:
      simple: [serde, toml, clap, env]
      layered: config
      dynamic_reload: validate_full_snapshot_then_arc_swap
      secrets: [secrecy, zeroize]
      dotenv: local_development_only
    serialization_and_validation:
      json: [serde, serde_json]
      input_validation: [newtypes, garde]
      json_schema: [schemars, jsonschema]
      compact_binary: postcard_with_versioned_envelope
      cross_language_contract: protobuf_with_prost
      unknown_fields:
        strict: [configuration, signed_input, security_sensitive_envelope]
        forward_compatible: [public_request]
  service_interfaces:
    http_server:
      default: [axum, tower, tower-http]
      lifecycle: graceful_shutdown_with_cancellation_and_bounded_drain
      required_controls: [request_id, sensitive_headers, structured_trace, authentication, body_limit, timeout, overload_protection]
      realtime_rule: sse_for_one_way_websocket_only_for_bidirectional_need
    api_contract:
      default: handwritten_typed_client_for_same_repo_first_party_frontend
      error_shape: [code, message, optional_request_id, optional_details]
      pagination_default: page_and_page_size_or_offset_and_limit
      api_path_default: /api
      add_openapi_when: [public_api, third_party_consumers, multiple_independent_clients, demonstrated_contract_drift]
      add_cursor_when: [large_or_high_churn_dataset, infinite_scroll_consistency_need]
      add_idempotency_key_when: [payment, job_creation, external_retryable_command]
    rpc:
      external_default: rest
      internal_typed_cross_language: [grpc, protobuf, tonic, prost]
      conditional: [grpc-web, connect, quinn, h3, custom_binary_protocol]
    http_client:
      default: [reqwest, rustls]
      reuse_long_lived_client: true
      required_controls: [connect_timeout, read_timeout, total_deadline, response_size_limit, redirect_limit]
      retry_rule: idempotent_or_idempotency_key_only
      untrusted_url_rule: ssrf_validation_and_redirect_revalidation
    graphql:
      default: false
      preferred_if_justified: async-graphql
      required_controls: [pagination, depth_limit, complexity_limit, rate_limit, authorization, error_masking]
    webhook:
      signing_default: standard_webhooks_hmac_sha256
      delivery_semantics: at_least_once
      reliability: [durable_outbox, exponential_backoff_with_jitter, dead_letter, manual_replay]
      security: [verify_raw_body, replay_window, event_id_deduplication, https_only, ssrf_validation]
  data_storage:
    relational_database:
      local_embedded: [sqlite, rusqlite_bundled]
      local_sqlite_minimum_version: "3.51.3"
      networked_service: [postgresql_18, sqlx_0_9]
      direct_postgres_driver_when_needed: tokio-postgres
      orm_default: false
    search_and_analytics:
      first_step: [postgresql_fts_and_pg_trgm, sqlite_fts5]
      product_search: meilisearch
      large_scale_search_logs_and_aggregations: opensearch
      local_columnar_analytics: [duckdb, parquet]
      index_rule: rebuildable_projection_updated_via_outbox_or_cdc
    object_storage:
      protocol: s3_compatible
      aws_full_capability: aws-sdk-s3
      portable_basic_interface: object_store
      upload_default: short_lived_presigned_direct_upload
      security: [private_by_default, tls_only, server_side_encryption, checksum, opaque_object_key]
    reliability:
      dual_write: transactional_outbox
      schema_migration: expand_migrate_contract
      postgres_backup: [base_backup, wal_pitr, pg_verifybackup, restore_drill]
      sqlite_backup: [online_backup_api, integrity_check, restore_drill]
      required_objectives: [rpo, rto, retention, owner]
    cache:
      classification_rule: choose_by_sharing_scope_data_size_and_rebuildability
      memory:
        default: scc_hashcache_3_8
        explicit_capacity_range_required: true
        default_capacity_limit_to_avoid: 256
        eviction_semantics: per_bucket_lru_not_global_lru
        upgrade_to_moka_0_12_for: [ttl, tti, per_entry_expiry, weighted_capacity, tinylfu, async_load_coalescing, eviction_listener]
      file:
        simple: [directories_cache_dir, atomic_tempfile_rename, checksum, bounded_cleanup]
        content_addressed: cacache_without_async_std_runtime
      hybrid: foyer_0_22
      external_shared: [valkey_9, rust_redis_1_4_connection_manager]

backend_capabilities:
  messaging_and_tasks:
    ephemeral_in_process: [tokio_tasktracker, cancellation_token, bounded_mpsc]
    durable_same_service:
      default: explicit_jobs_table_in_existing_database
      postgresql_claim: for_update_skip_locked_with_lease
      sqlite_claim: single_owner_worker
    external_broker:
      default: none
      global_preference: none
      evaluate_only_when: database_jobs_no_longer_meet_project_requirements
      decision_factors: [delivery_semantics, ordering, retention_and_replay, existing_operations, managed_environment]
    schedule:
      simple_periodic: tokio_interval_with_skip_or_delay
      wall_clock_cron: croner_3_with_persisted_next_run_at
    delivery_semantics: [at_least_once, idempotent_handler, bounded_retry_with_jitter, dead_letter, manual_replay]
  realtime:
    browser_server_to_client: axum_sse
    browser_bidirectional: axum_websocket
    device_or_agent_brokered: [mqtt_5, rumqttc_0_25]
    browser_high_efficiency_when_compatibility_is_relaxed: [webtransport_over_http3, wtransport_0_7]
    custom_native_transport_only: [quic, quinn_0_11]
    required_controls: [resume_cursor, bounded_output_queue, heartbeat, idle_timeout, payload_limit, connection_quota, graceful_drain]
  notifications:
    boundary: narrow_notification_sender_port
    email:
      default: provider_http_api_over_reqwest
      smtp_when_required: lettre_0_11_tokio_rustls
      templates: minijinja_2_21
      local_test_sink: mailpit
    push:
      apns_direct: a2_0_10
      fcm: official_http_v1_with_short_lived_oauth_token
      web_push_only_if_needed: web_push_0_11
    reliability: [transactional_outbox, channel_specific_retry, idempotency, provider_receipts, suppression]
  feature_flags:
    compile_time: cargo_features_only_for_optional_capabilities
    simple_runtime: typed_local_config
    remote_or_targeted: [open_feature_0_3, provider_adapter]
    remote_trigger: [runtime_kill_switch, multi_instance_change, targeting, percentage_rollout, experiment]
    required_metadata: [type, safe_default, owner, category, created_at, expires_at, cleanup_task]
    forbidden_uses: [authorization, entitlement, tenant_isolation]

security_and_supply_chain:
  excluded_for_now: [authentication, authorization]
  cryptography:
    tls: [rustls_0_23, aws_lc_rs_default_provider]
    alternate_tls_provider_only_for_target_constraints: ring
    fips_only_when_required: rustls_fips_aws_lc_rs
    password_hash: argon2id
    primitives_by_purpose:
      protocol_mac: hmac_sha256
      interoperable_digest: sha256
      internal_fast_content_hash: blake3
      new_application_signature: ed25519
      aead: [aes_gcm, chacha20_poly1305]
    secret_memory: [secrecy, zeroize]
    production_key_storage: [os_keychain, kms_or_vault_or_hsm, envelope_encryption, versioned_key_id, rotation]
  supply_chain:
    rust: [commit_cargo_lock, cargo_locked, cargo_deny_all_checks]
    cargo_audit_also_required: false
    frontend: [commit_pnpm_lock, frozen_lockfile, minimum_release_age_1_day, block_exotic_subdeps, explicit_allow_builds, pnpm_audit_high, pnpm_audit_signatures_before_release]
    github_when_available: [dependency_review, dependabot_security_updates, actions_pinned_to_full_sha, least_permissions, oidc_credentials]
    release_sbom:
      rust: cargo_cyclonedx_0_5_cli
      frontend: pnpm_11_sbom
      container_or_composite: syft
    release_attestation_when_supported: github_artifact_provenance_and_sbom
    high_assurance_only: [cargo_vet, full_vendoring, private_registry, mandatory_slsa_level]

algorithm_preferences:
  crypto_security_and_common_algorithms:
    reviewed_on: "2026-08-09"
    extends_security_baseline_without_replacing_it: true
    password_kdf_and_mac:
      status: active
      password_storage:
        default: [argon2_0_5, argon2id, phc_string, per_record_os_csprng_salt]
        parameter_policy: benchmark_on_target_hardware_and_concurrency_then_rehash_on_success_when_outdated
      password_based_key_derivation: separate_api_salt_context_and_output_from_password_verification
      high_entropy_key_derivation: [hkdf_0_13, sha256, domain_separated_info]
      message_authentication: [hmac_0_13, sha256, library_constant_time_verify]
      compatibility_only: [pbkdf2, scrypt]
      pepper_only_with: [kms_or_hsm, versioning, rotation, disaster_recovery]
    encryption_signature_and_key_exchange:
      status: active
      application_envelope_without_interop_or_fips_constraint: [chacha20poly1305_0_11, xchacha20_poly1305]
      standard_interop_hardware_or_fips: aes_256_gcm
      protocol_defined: use_protocol_algorithm_including_standard_chacha20_poly1305
      nonce_rule: never_repeat_nonce_under_same_key
      envelope_fields: [schema_version, algorithm, key_id, nonce, ciphertext_and_tag]
      aad_bindings: [tenant, object_id, purpose, schema_version]
      new_application_signature: [ed25519_dalek_3, versioned_canonical_bytes, domain_tag]
      platform_standard_hardware_or_fips_signature: p256_ecdsa
      rsa: legacy_interop_or_existing_signature_verification_only
      x25519: only_inside_authenticated_standard_protocol_then_hkdf
      prefer_protocols_over_custom_handshake: [tls_1_3, noise, hpke]
    randomness_tokens_and_secrets:
      status: active
      general_sampling: rand_0_10
      security_sensitive_randomness: [os_csprng, crypto_crate_secure_generation_api_or_getrandom_0_4]
      deterministic_seeded_rng_only_for: [tests, simulation, non_security_algorithms]
      opaque_bearer_token:
        entropy: 32_random_bytes
        encoding: base64_url_safe_no_pad
        server_storage: sha256_digest_or_keyed_hmac_when_offline_enumeration_matters
        metadata: [purpose, subject, created_at, expires_at, revoked_at]
      not_secrets: [uuid, timestamp, sequential_id, non_crypto_hash]
      memory_and_comparison: [secrecy_0_10, zeroize_1_9, primitive_verify_or_subtle_2_6]
      prohibited_secret_sinks: [debug, logs, trace_baggage, metrics_labels, panic_or_error_chain, url_query, frontend_bundle, persistent_crash_report]
    hashing_checksums_and_ids:
      status: active
      interoperable_or_adversarial_integrity_digest: sha2_0_11_sha256
      internal_content_addressing_dedup_and_large_files: blake3_1_8
      accidental_corruption_only: crc32c_0_6
      trusted_input_high_speed_fingerprint_or_sharding_only: xxhash_rust_0_8_xxh3
      database_time_ordered_id: uuid_1_v7
      public_random_id: uuid_1_v4
      authorization_secret: 256_bit_opaque_token_not_uuid
      untrusted_hash_keys: default_hashdos_resistant_hasher
      alternate_hashers_only_when: trusted_input_and_benchmark_proven
      forbidden_non_crypto_hash_uses: [password, token, mac, signature, adversarial_integrity, collision_intolerant_id]
    encoding_compression_and_archives:
      status: active
      binary_text:
        url_cookie_token: base64_0_23_url_safe_no_pad
        protocol: exact_protocol_alphabet_and_padding
        human_diagnostic: hex
        rules: [encoding_is_not_encryption, bound_before_decode, canonical_representation]
      compression:
        internal_files_backup_large_transfer: zstd_0_13
        http_or_legacy_interop: flate2_1_1_gzip
        precompressed_static_web: brotli_8_with_gzip_fallback
        measured_low_latency_ratio_secondary: lz4_flex_0_14_frame
      archives:
        unix_or_internal: tar_0_4_plus_zstd
        windows_or_end_user_exchange: zip_8_with_minimal_features
        zip_encryption_as_general_secure_envelope: false
      untrusted_unpack_limits: [compressed_size, total_uncompressed_size, per_file_size, entry_count, compression_ratio, nesting_depth, processing_time]
      path_controls: [reject_absolute, reject_dotdot, reject_device_files, reject_dangerous_links, isolated_temp_dir, atomic_commit]
      high_risk_unpack: capability_api_or_os_sandbox_for_toctou
      disable_dynamic_compression_when: attacker_controlled_input_is_mixed_with_secret
    text_and_common_data_algorithms:
      status: active
      untrusted_text_regex: [regex_1_13, worst_case_o_m_times_n]
      advanced_multi_pattern_or_automata: [regex_automata_0_4, explicit_pattern_dfa_haystack_match_limits]
      backtracking_regex: trusted_bounded_patterns_only_with_time_or_step_limit
      unicode:
        normalize_only_when_domain_requires: unicode_normalization_0_1_nfc
        nfkc_or_case_folding_only_when: product_semantics_allow_compatibility_folding
        security_identifier_rule: no_locale_dependent_lowercase_or_display_fuzzy_equivalence
      fuzzy_matching_only_for: [ui_search, suggestion, ranking]
      fuzzy_matching_forbidden_for: [authentication, authorization, signature_subject, dedup_primary_key, security_rule]
      data_structures_by_shape:
        stable_insertion_order: indexmap_2_14
        measured_small_inline_sequence: smallvec_1_15
        dense_bits: bitvec
        sparse_integer_set: roaring
        graphs: petgraph
        cpu_bound_data_parallelism: rayon
      default_first: [standard_library_sort, binary_search, heap, btree, hashbrown_map]
      no_global_algorithm_utility_pack: true
      specialization_requires: [real_data_distribution, benchmark, memory_bound, determinism, cancellation, error_propagation]
      async_io_uses_tokio_not_rayon: true

observability_and_performance:
    logging_and_tracing:
      default: [tracing_0_1, tracing_subscriber_0_3_23]
      service_output: structured_json_to_stdout_stderr
      cli_tui_output: compact_human_with_optional_json
      local_rolling_file_only_when_needed: tracing_appender_0_2_5
      libraries_install_global_subscriber: false
      propagation: [w3c_traceparent, w3c_tracestate]
      opentelemetry_only_for_distributed_or_existing_collector:
        crates: [opentelemetry_0_32, tracing_opentelemetry_0_33]
        export: otlp_to_collector
      controls: [field_allowlist, secret_redaction, bounded_writer, dropped_event_metric, bounded_flush]
    metrics_and_alerting:
      long_running_process_default: [metrics_0_24_6, metrics_exporter_prometheus_0_18_3]
      excluded_by_default: [cli, tui, library, short_lived_job]
      methods: [red_for_services, use_for_resources, queue_and_job_freshness]
      forbid_high_cardinality_labels: [user_id, tenant_id, request_id, trace_id, raw_url, error_message]
      otel_metrics_replaces_prometheus_exporter_when_platform_exists: true
      alerting: [symptom_based, actionable, dashboard, runbook, owner]
    error_monitoring:
      global_vendor_default: none
      conditional_preference: sentry
      rust: [sentry_0_48_5, disable_default_features, rustls, only_required_integrations]
      react: sentry_react_when_project_requires_remote_error_aggregation
      source_maps: [upload_before_deploy, match_release, validate, remove_from_public_artifact]
      privacy: [session_replay_off_by_default, pii_allowlist_and_redaction, configurable_sampling]
      avoid_double_reporting_when_existing_otel_or_error_platform: true
    performance_engineering:
      workflow: [budget, representative_workload, profile, optimize, regression_benchmark]
      microbenchmark_default_when_needed: criterion_0_8_2
      divan_only_for_specific_fit: [concise_parameterization, allocation_count, threaded_contention]
      external_profilers: [linux_perf_and_cargo_flamegraph, macos_instruments_xctrace, windows_etw_wpa]
      async_diagnostics_only: tokio_console
      embedded_profiler_only_when_needed: pprof
      http_local_baseline: oha
      web: [route_bundle_budget, production_bundle_diff, lighthouse_ci_trend, field_core_web_vitals]
      core_web_vitals_p75: { lcp_seconds_max: 2.5, inp_ms_max: 200, cls_max: 0.1 }
      hard_regression_gate_requires: [fixed_machine, fixed_workload, repeatable_baseline]

testing_and_quality:
    rust_testing:
      default: [cargo_test, unit_tests, black_box_integration_tests]
      async: [tokio_test, paused_time_for_timers, no_real_sleep]
      nextest_only_for: [multi_crate_workspace, slow_suite, timeout, junit, partitioning]
      doctest_with_nextest: cargo_test_doc_separate
      retries_default: 0
      isolation: [os_assigned_port, tempfile, per_test_database, no_shared_mutable_fixture]
      conditional:
        property: proptest_1_11
        snapshot: insta_1_48_with_manual_review
        fuzz: cargo_fuzz_for_untrusted_or_unsafe_boundaries
        concurrency_model: loom_0_7_2_for_custom_primitives
        high_risk_scheduled: [miri, sanitizer, cargo_mutants]
    frontend_testing:
      default: [vitest_4_1, react_testing_library, jsdom]
      pure_logic_environment: node
      real_browser_component_only_for: [layout, focus, selection, pointer, browser_api, compatibility]
      real_browser_component_runner: vitest_browser_mode_with_playwright
      query_priority: [role_and_accessible_name, label, text, stable_test_id]
      network_mocking_when_complex: msw_2
      e2e: [playwright_1_62, chromium_pr_smoke]
      extra_browsers_only_when_supported: [firefox, webkit]
      diagnostics: [trace_on_failure, console, necessary_screenshot]
      retries_default: 0
      accessibility: [axe_on_key_states, manual_keyboard_focus_screen_reader_zoom]
      visual_regression_only_for_stable_high_value_surfaces: true
    cross_stack_integration:
      same_repo_first_party_default: [typed_client_compile, real_axum_router, real_serialization, chromium_smoke]
      full_openapi_governance_default: false
      storage: [temporary_sqlite_with_migrations, real_postgres_for_postgres_specific_behavior]
      testcontainers_only_when_docker_and_real_process_are_justified: testcontainers_0_27
      third_party_http_double: wiremock_0_6_5
      public_or_independently_released_api: [openapi_3_1, oasdiff_breaking_check, generated_client_compile, real_server_contract_smoke]
      critical_journey: rust_service_to_real_storage_to_typed_client_to_react_ui
    quality_gates:
      rust_pr: [cargo_fmt_check, cargo_check_workspace_all_targets, clippy_deny_warnings, tests, cargo_deny_check]
      invalid_all_features_policy: supported_feature_matrix
      frontend_pr: [pnpm_frozen_install, typescript_typecheck, eslint, vitest_run, production_build, playwright_chromium_smoke]
      full_core_gates: [merge_queue, release]
      coverage:
        rust: cargo_llvm_cov
        frontend: vitest_v8
        universal_percentage_threshold: false
        reviewed_thresholds_only_for_critical_modules: true
      conditional_release_or_specialized: [cargo_semver_checks, openapi_breaking, ffi_abi, fuzz, miri, sanitizer, cargo_mutants, full_browser_matrix, visual_regression, performance_benchmark]
      forbidden: [auto_accept_snapshot, auto_update_lockfile, auto_fix_audit, unlimited_retry]

frontend_core_architecture:
    rendering_and_routing:
      authenticated_console: [react_19_2, vite_8_1, spa, tanstack_router_1]
      route_rules: [file_based, typed_params_and_search, automatic_code_splitting]
      docs_and_content: [astro_6, starlight, static_prerender_default]
      astro_on_demand_rendering: per_route_only_when_dynamic
      public_content_heavy_site: astro_islands_or_hybrid
      react_ssr_framework_project_level_candidates: [react_router_framework_mode, tanstack_start, nextjs]
      tanstack_start_currently_default: false
      tanstack_start_status: release_candidate
      nextjs_only_for: [rsc_or_server_functions, ecosystem_advantage, deployment_advantage]
      console_default_rsc_or_ssr: false
    ui_and_design_system:
