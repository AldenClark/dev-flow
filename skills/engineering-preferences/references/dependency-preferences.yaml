    cli_and_tui:
      cli_default: [clap_4_6, derive, env]
      public_contract: [command_names, options, defaults, exit_codes, stdout_format, stable_error_codes]
      output: { stdout: result_only, stderr: diagnostics_logs_progress, formats: [human, json, jsonl] }
      terminal_rules: [tty_detection, no_color, explicit_color_override]
      diagnostics_human: miette
      release_generated: [clap_complete, clap_mangen_0_3]
      interactive_only_when_explicit_and_tty: dialoguer_0_12
      progress_only_when_tty: indicatif
      full_screen_tui_only_when_needed: [ratatui_0_30, bundled_crossterm_backend]
      simple_tui_adds_tokio: false
      async_tui: [central_event_loop, bounded_channels, cancellation, capped_refresh, terminal_restore]
      tests: [assert_cmd, ratatui_test_backend, real_terminal_edge_cases]
    ffi:
      selection_scope: per_boundary_not_per_repository
      architecture:
        rust_core_owns: [parsing, protocol, crypto, routing, state_machine, queues, portable_business_rules]
        platform_shell_owns: [ui, platform_apis, permissions, process_and_extension_or_service_lifecycle, platform_policy]
        layers: [pure_rust_core, narrow_raw_binding_crate_or_module, safe_swift_or_kotlin_facade]
      control_plane:
        fit: shared_low_or_moderate_rate_typed_api
        default: uniffi_0_32_exact
        rules: [exact_generator_runtime_crate_match, reproducible_generation, inspect_generated_code, generated_diff, integration_test]
        apple_only_high_level_candidate: swift_bridge_after_version_maturity_and_output_review
      apple_and_kotlin_native_data_plane:
        fit: [hot_packets_frames_buffers, long_lived_public_abi, kotlin_native_cinterop]
        default: [versioned_c_abi, cbindgen_0_29_or_manually_stable_header]
      android_data_plane:
        fit: [hot_path, direct_jvm_or_android_api]
        default: [jni_onload, register_natives, jni_0_22]
        jvm_ffm_is_android_default: false
        jna_or_jnr_only_after: measured_performance_and_deployment_fit
      abi_protocol:
        required: [fixed_width_integer, repr_c_struct, explicit_byte_order, struct_size, abi_major_minor, capability_handshake, reserved_fields, opaque_generation_checked_handle]
        forbidden: [rust_string, rust_vec, rust_reference, rust_slice, box, arc, trait_object, bool, char, usize, raw_enum, default_layout_struct]
        buffer_contract: [length_unit, capacity, alignment_and_layout, mutability, initialized_range, max_and_overflow, empty_and_null_semantics, release_cancel_close]
        allocator_rule: rust_allocations_freed_by_rust
        ci: [abi_header_or_fingerprint_diff, final_layout_and_symbol_inspection]
      lifecycle:
        state_machine: [open, closing, closed]
        close: [explicit, idempotent, reject_new_work, wait_or_defer_until_in_flight_buffer_leases_and_callbacks_quiesce]
        gc_deinit_cleaner_finalizer: fallback_only
        async_terminal_gate: [pending, succeeded, failed, cancelled, timed_out, owner_closed]
        races_to_test: [concurrent_close, close_vs_call, close_vs_completion, close_vs_callback, reentrancy, synchronous_completion_before_start_returns, early_cancellation, stale_handle_aba, buffer_lease_lifetime]
      swift_rules: [actor_does_not_prove_native_thread_safety, unchecked_sendable_requires_invariant_and_stress, unsafe_bytes_pointer_never_escapes, bytes_no_copy_requires_correct_deallocator_and_exclusive_mutation]
      jni_rules: [cache_javavm_not_jnienv, class_loader_safe_lookup, verify_native_descriptors_and_r8_rules, explicit_local_global_weak_refs, handle_pending_exceptions, mutf8_not_binary_utf8, short_critical_regions, direct_byte_buffer_is_view_not_owner]
      kotlin_native_rules: [memscoped_and_usepinned_pointers_do_not_escape, staticcfunction_has_no_capture, stableref_disposed_after_unregister_and_quiescence, kmp_expect_actual_shares_semantics_not_pointer_types]
      callback_and_stream_rules: [declare_thread_concurrency_reentrancy_and_blocking, no_foreign_call_while_holding_reentrant_rust_lock, finite_capacity, explicit_backpressure_or_overflow, sequence_and_drop_counters, unsubscribe_on_termination]
      panic_crosses_ordinary_boundary: false
      nested_block_on_in_async_worker: false
      hot_path_progression: [benchmark_bounded_copy, batching, caller_provided_buffer, immutable_lease, ring_or_slab]
      cross_process_rule: versioned_ipc_never_pointer_or_handle
      apple_artifact_tests: [xcframework_device_simulator_macos_catalyst_slices, headers_modulemap_symbols_dependencies_deployment_target, strict_concurrency, tsan, asan, real_device]
      android_artifact_tests: [aar_apk_aab_each_promised_abi, min_sdk_ndk_page_alignment, elf_soname_dependencies_symbols, loader_and_native_registration, r8_rules, debug_symbols, checkjni, process_death_restart, emulator_and_real_device]
      missing_evidence_label: not_run
    platform_integration:
      common_rule: platform_shell_owns_lifecycle_permissions_and_installation
      apple:
        shell: swift_or_objc
        direct_framework_binding_only_when_needed: [objc2_0_6, narrow_framework_features]
        packet_tunnel: separate_network_extension_process
        ipc: [app_group, provider_message, xpc, socket, versioned_shared_memory]
        macos_helper: smappservice_on_macos_13_plus
        ios_background: resumable_expirable_not_guaranteed_on_time
      android:
        shell: kotlin
        deferred_background: workmanager
        user_visible_continuous_only: foreground_service_with_notification
        ndk_api_only_when_needed: ndk_0_9
        artifact_checks: [promised_abis, min_sdk, so_path, loader, r8_keep, process_death_recovery]
      windows:
        high_level_api: windows_0_62
        low_level_only_when_needed: windows_sys_0_61
        long_running_agent: [scm, windows_service_0_8]
        short_periodic_work: task_scheduler_2
        service_rules: [state_reporting, stop_and_drain, least_privilege_account]
      linux:
        long_running_service: foreground_under_systemd_or_supervisor
        self_daemonize_default: false
        systemd_integration_only_when_needed: sd_notify_0_5
        sandbox_desktop_host_access: [xdg_desktop_portal, ashpd_0_13]
      dependency_location: target_cfg_or_platform_crate
      final_artifact_and_real_platform_validation_required: true

delivery_release_deployment_and_docs:
  status_by_topic:
    ci_cd: active
    builds_and_containers: active
    releases_and_updates: active
    deployment: active
    engineering_documentation: active
  decisions:
    ci_cd:
      platform: github_actions
      trust_domains: [pull_request_validation, release, deployment]
      pr:
        permissions: contents_read
        concurrency: cancel_stale_run_per_ref
        default_runner: linux
        platform_matrix_only_for: [target_specific_code, ffi, native_ui, installers]
        rust_toolchain: pinned_current_stable_for_apps
        msrv_job_only_for: public_library_or_explicit_msrv_contract
      actions: [pin_third_party_to_full_commit_sha, automated_update_prs, least_permission_per_job]
      secrets: [never_expose_to_untrusted_pr, signing_only_after_untrusted_tests, protected_environment]
