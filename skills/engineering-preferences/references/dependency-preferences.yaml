selection_rules:
  - choose the product archetype before dependencies
  - start from the smallest strong-default set
  - add conditional dependencies only for demonstrated capabilities
  - keep Rust native UI and Web frontend as separate archetypes
  - recheck versions maintenance licenses and advisories before release
