    native_ui: active
    cli_and_tui: active
    ffi: active
    platform_integration: active
  decisions:
    native_ui:
      primary: [gpui_0_2_exact, gpui_component_0_5_exact]
      fallback: slint_1_17
      fallback_when: [gpui_platform_gap, gpui_maturity_gap, accessibility_gap, declarative_or_embedded_hmi_fit]
