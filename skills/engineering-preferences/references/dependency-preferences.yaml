      release_concurrency: do_not_cancel_in_progress
      artifacts: [short_retention_for_ci_diagnostics, isolated_release_artifacts_with_checksum_sbom_provenance]
      reusable_workflow_only_after: repeated_cross_repository_contract
    builds_and_containers:
      default: [native_cargo_and_pnpm, buildkit, named_multi_stage_dockerfile]
      cache_mounts: [cargo_registry, cargo_git, cargo_target, pnpm_store]
      docker_context: strict_dockerignore
      cargo_chef_default: false
      cargo_chef_only_after: measured_dependency_rebuild_bottleneck
      runtime:
        compatibility_first: glibc_slim
        scratch_only_when: fully_static_and_operational_requirements_verified
        alpine_musl_only_when: explicit_size_or_deployment_need_and_compatibility_performance_validation
        rules: [fixed_non_root_uid_gid, minimal_runtime_files, explicit_writable_volume, oci_labels, no_build_secrets]
      release_pins: [toolchain, builder_image_digest, runtime_image_digest, critical_tool_versions]
      common_service_architectures: [linux_amd64, linux_arm64]
      multi_arch: [build_and_test_each_arch, native_runner_or_reliable_cross_preferred, qemu_not_for_performance_claims, assemble_manifest_after_validation]
      promotion: build_candidate_once_then_promote_by_checksum_or_digest
      reproducibility_default: [locked_inputs, source_and_toolchain_record, provenance, rebuildable]
      bit_for_bit_only_for: compliance_or_high_value_supply_chain
    releases_and_updates:
      versioning: [semver, v_prefixed_tag, alpha_beta_rc_prerelease]
      consistency: [tag, cargo_manifest, package_manifest, installer_metadata, image_label, release_notes]
      published_artifact_mutability: immutable
      changelog: manually_curated_user_visible_changes_not_git_log
      rust_crate_preflight: [cargo_publish_dry_run, cargo_package_list, doc_test, semver_check, supply_chain_gates]
      rust_binary_packaging:
        standard_cli_candidate: dist_cargo_dist
        platform_signed_or_strict_contract: custom_platform_pipeline
      pnpm_workspace:
        minimum_for_native_release: pnpm_11_13
        default: [pnpm_change, pnpm_version_recursive_dry_run, pnpm_version_recursive]
        format: changeset_markdown
        changesets_cli_default: false
      npm_publish: trusted_publishing_oidc_with_provenance
      candidate: [protected_tag, sha256, sbom, provenance, signature, final_artifact_verification]
      stable_promotion: same_immutable_artifact_or_digest_no_rebuild
      auto_update:
        default_dependency: false
        distribution_priority: platform_store_then_signed_independent_feed
        signed_manifest: [schema, channel, version, os_arch, url, size, sha256, minimum_supported_version, rollout]
        client_rules: [verify_manifest_signature, verify_artifact_hash, atomic_replace, last_known_good, staged_rollout, pause_or_kill_switch]
      server_rollback: [previous_image_digest_or_signed_package, expand_contract_migrations, backup_restore_evidence]
      release_rerun: idempotent_and_content_verifying
    deployment:
      selection:
        static_web_or_docs: object_storage_or_static_hosting_plus_cdn
        single_host_service_or_agent: native_binary_plus_hardened_systemd
        tightly_related_multi_service_or_local_bundle: docker_compose
        kubernetes_only_for: [multi_node, high_availability_replicas, rolling_deploy, autoscaling, multi_tenant_isolation, existing_cluster_platform]
      static_cache: [immutable_long_cache_for_hashed_assets, short_or_revalidated_html_and_manifest, atomic_directory_publish, previous_release_rollback]
      compose_production: [image_digest, persistent_volumes, health_check, restart_policy, resource_limits, logging, backup, no_dev_bind_mount_or_default_secret]
      kubernetes:
        stateless: deployment
        stable_identity_or_storage: evaluate_statefulset
        configuration: plain_manifests_or_kustomize_first
        helm_only_for: reusable_product_chart_or_heavy_parameterization
      environment_promotion: same_immutable_artifact_or_digest
      runtime_contract: [external_config_and_secret, startup_validation, startup_readiness_liveness, bounded_graceful_drain]
      migrations: [separate_controlled_job, concurrency_lock, expand_contract, rollback_plan]
      rollout_default: rolling
      canary_or_blue_green_requires: [real_traffic_split, metrics, automated_decision, fast_rollback]
      deployment_success: [rollout_converged, critical_smoke, error_and_latency_check, observation_window]
      required_runbooks: [install, upgrade, rollback, backup_restore, secret_certificate_rotation, logs, health]
    engineering_documentation:
      minimum_information: [readme, contributing, architecture, security, changelog_or_release_notes]
      avoid_empty_documents: true
      adr:
        only_for: long_lived_architecture_protocol_data_security_deployment_or_dependency_decision
        fields: [status, context_and_constraints, decision, alternatives, consequences, verification]
        history: supersede_do_not_silently_rewrite
      information_architecture: [tutorial, how_to, reference, explanation]
      rust_api: [rustdoc, doctest_public_examples]
      protocol_reference: generated_from_authoritative_schema
      docs_hosting: repository_markdown_first_then_astro_starlight_when_scale_or_public_search_requires
      production_runbook: [deploy_rollback, backup_restore, migrations, secret_certificate_rotation, capacity, alerts, common_failures, owner, applicable_version, last_verified]
      threat_model_when: [authentication, network_protocol, keys, untrusted_input, ffi, cross_process_boundary, sensitive_data]
      threat_model_fields: [assets, trust_boundaries, data_flow, threats, mitigations, residual_risk]
      docs_ci: [link_check, code_snippet_or_doctest, schema_check, docs_site_build]
      source_of_truth: one_authoritative_source_link_or_generate_elsewhere

