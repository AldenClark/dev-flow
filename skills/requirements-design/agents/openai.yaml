interface:
  display_name: "Requirements and Design"
  short_description: "Clarify material product behavior and scope"
  default_prompt: "Use $requirements-design to separate goals, constraints, preferences, candidate mechanisms and delegated technical exploration. Investigate technical facts, proactively clarify material business choices with meaningful options, and allow additions, combinations or uncertainty. Settled business meaning permits design; before an important new feature's first implementation obtain one explicit whole business-and-technical understanding confirmation or explicit waiver. Reuse accepted scope, keep local answers local, and remain in Default mode."
