name: Release candidate evidence

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer declared by .codex-plugin/plugin.json
        required: true
        default: "1.0.2"
        type: string
      expected_sha:
        description: Full immutable commit SHA to build and attest
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.version }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-and-attest:
    name: Build, verify, inventory, and attest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      ARTIFACT_DIR: dist
      SYFT_FILE_METADATA_SELECTION: all
      SYFT_SOURCE_NAME: dev-flow
      SYFT_SOURCE_VERSION: ${{ inputs.version }}
      SYFT_SOURCE_SUPPLIER: Dev Flow Contributors

    steps:
      - name: Fetch and bind the approved commit
        shell: bash
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha must be a full lowercase SHA-1 commit id" >&2
            exit 2
          fi
          if [[ "$GITHUB_SHA" != "$EXPECTED_SHA" ]]; then
            echo "workflow SHA $GITHUB_SHA does not match approved SHA $EXPECTED_SHA" >&2
            exit 2
          fi
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout --detach "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 -c "import sys; assert sys.version_info >= (3, 11), sys.version"

      - name: Record environment
        run: >-
          python3 -c "import json, os, platform, sys; print(json.dumps({'python': sys.version, 'platform': platform.platform(), 'machine': platform.machine(), 'runner_image': os.environ.get('ImageOS'), 'runner_version': os.environ.get('ImageVersion'), 'commit': os.environ['GITHUB_SHA']}, sort_keys=True))"

      - name: Run behavioral tests
        run: python3 -W error::ResourceWarning -m unittest discover -s evals -v

      - name: Run structural contracts
        run: python3 evals/run_contract_checks.py

      - name: Validate plugin repository
        run: python3 skills/dev-flow/scripts/dev-flow.py check --plugin-root .

      - name: Validate focused Skill suite and cutover
        run: python3 skills/dev-flow-maintainer/scripts/validate-suite.py

      - name: Compile Python sources
        run: python3 -m compileall -q hooks skills evals tools

      - name: Confirm tests did not modify tracked files
        run: git diff --exit-code

      - name: Build deterministic source archive
        run: python3 tools/build_release.py build --root . --output "$ARTIFACT_DIR" --version "$RELEASE_VERSION" --commit "$EXPECTED_SHA"

      - name: Verify archive before inventory
        run: python3 tools/build_release.py verify --artifact-dir "$ARTIFACT_DIR" --expected-version "$RELEASE_VERSION" --expected-commit "$EXPECTED_SHA"

      - name: Extract the verified source for inventory
        shell: bash
        run: |
          mkdir release-source
          tar -xzf "$ARTIFACT_DIR/dev-flow-$RELEASE_VERSION.tar.gz" -C release-source --strip-components=1

      - name: Generate SPDX 2.3 JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: release-source
          format: spdx-json
          output-file: ${{ env.ARTIFACT_DIR }}/dev-flow-${{ env.RELEASE_VERSION }}.spdx.json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Validate SBOM identity and finalize checksums
        shell: bash
        run: |
          python3 -c "import json, os, pathlib; version=os.environ['RELEASE_VERSION']; p=pathlib.Path(os.environ['ARTIFACT_DIR']) / f'dev-flow-{version}.spdx.json'; d=json.loads(p.read_text()); assert d.get('spdxVersion') == 'SPDX-2.3', d.get('spdxVersion'); assert d.get('name') == 'dev-flow', d.get('name'); assert d.get('documentNamespace'), 'SBOM namespace is missing'; assert d.get('files'), 'SBOM file inventory is empty'; assert any(item.get('name') == 'dev-flow' and item.get('versionInfo') == version for item in d.get('packages', [])), 'SBOM root package identity is missing'"
          python3 tools/build_release.py checksums \
            --artifact-dir "$ARTIFACT_DIR" \
            --file "dev-flow-$RELEASE_VERSION.tar.gz" \
            --file release-manifest.json \
            --file "dev-flow-$RELEASE_VERSION.spdx.json"
          python3 tools/build_release.py verify --artifact-dir "$ARTIFACT_DIR" --expected-version "$RELEASE_VERSION" --expected-commit "$EXPECTED_SHA"

      - name: Attest archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.ARTIFACT_DIR }}/dev-flow-${{ env.RELEASE_VERSION }}.tar.gz

      - name: Attest archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.ARTIFACT_DIR }}/dev-flow-${{ env.RELEASE_VERSION }}.tar.gz
          sbom-path: ${{ env.ARTIFACT_DIR }}/dev-flow-${{ env.RELEASE_VERSION }}.spdx.json

      - name: Upload immutable candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-flow-${{ env.RELEASE_VERSION }}-${{ github.sha }}
          path: |
            ${{ env.ARTIFACT_DIR }}/dev-flow-${{ env.RELEASE_VERSION }}.tar.gz
            ${{ env.ARTIFACT_DIR }}/dev-flow-${{ env.RELEASE_VERSION }}.spdx.json
            ${{ env.ARTIFACT_DIR }}/release-manifest.json
            ${{ env.ARTIFACT_DIR }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
