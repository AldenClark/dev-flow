name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python: ["3.11", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Record environment
        run: >-
          python -c "import json, os, platform, sys; print(json.dumps({'python': sys.version, 'platform': platform.platform(), 'machine': platform.machine(), 'runner_image': os.environ.get('ImageOS'), 'runner_version': os.environ.get('ImageVersion')}, sort_keys=True))"

      - name: Run behavioral tests
        run: python -W error::ResourceWarning -m unittest discover -s evals -v

      - name: Run structural contracts
        run: python evals/run_contract_checks.py

      - name: Validate assurance methodology and project knowledge
        run: |
          python skills/dev-flow/scripts/dev-flow.py validate-methods --root .
          python skills/dev-flow/scripts/dev-flow.py validate-knowledge --root .

      - name: Validate plugin repository
        run: python skills/dev-flow/scripts/dev-flow.py check --plugin-root .

      - name: Validate focused Skill suite and cutover
        run: python skills/dev-flow-maintainer/scripts/validate-suite.py

      - name: Validate protected data-security controls
        run: python skills/company-data-security/scripts/doctor.py --plugin-root .

      - name: Compile Python sources
        run: python -m compileall -q hooks skills evals tools

      - name: Confirm tests did not modify tracked files
        run: git diff --exit-code
