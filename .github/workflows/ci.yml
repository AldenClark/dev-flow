name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Run behavioral tests
        run: python -m unittest discover -s evals -v

      - name: Run structural contracts
        run: python evals/run_contract_checks.py

      - name: Validate plugin repository
        run: python skills/dev-flow/scripts/dev-flow.py check --plugin-root .

      - name: Compile Python sources
        run: python -m compileall -q hooks skills evals

      - name: Confirm tests did not modify tracked files
        run: git diff --exit-code
